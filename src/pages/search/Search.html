<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/style.css" />
    <script type="module" src="../../commons/Commons.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <title>Document</title>
  </head>
  <body class="bg-searchBackground font-Pretendard">
    <div class="min-h-screen flex flex-col">
      <!-- 상단 검색바 -->
      <header class="bg-white">
        <div class="relative px-4 py-3">
          <label for="search-input" class="sr-only">검색어 입력</label>
          <input id="search-input" type="search" placeholder="검색어 입력" aria-label="검색어 입력" class="w-full text-center text-gray-700 placeholder-gray-400 focus:outline-none" />
        </div>
      </header>

      <!-- 콘텐츠 영역 -->
      <main class="mx-auto px-4 pb-1">
        <!-- 추천 인기 키워드 -->
        <section aria-labelledby="popular-keywords-title">
          <h2 id="popular-keywords-title" class="text-[12px] text-br-contentTertiary mt-7">추천 작가 키워드</h2>
          <p class="mt-[15px] text-[20px] text-br-contentPrimary">
            일상의 따뜻한 위로,
            <span class="text-[20px] text-br-primary font-medium">그림</span>작가를 만나요.
          </p>
        </section>

        <!-- 최근 검색어 -->
        <section aria-labelledby="recent-searches-title" class="mt-[72px] border-t border-br-line">
          <h2 id="recent-searches-title" class="text-[12px] text-br-detailsSecondary mb-3 mt-[18px]">최근 검색어</h2>

          <ul class="mt-3 space-y-2">
            <li class="flex items-center justify-between mt-5">
              <span class="text-[15px] text-br-detailsTitle">사진꿀</span>
              <button aria-label="사진꿀 검색어 삭제" class="text-br-loginLine">✕</button>
            </li>
            <li class="flex items-center justify-between mt-5">
              <span class="text-[15px] text-br-detailsTitle">글</span>
              <button aria-label="글 검색어 삭제" class="text-br-loginLine">✕</button>
            </li>
          </ul>
        </section>
      </main>
    </div>
    <navigate-component></navigate-component>
  </body>
</html>
