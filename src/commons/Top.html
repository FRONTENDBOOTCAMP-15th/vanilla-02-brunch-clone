<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.ts"></script>
    <title>Document</title>
  </head>
  <body>
    <!-- 로그인 전-->
    <div class="flex items-center justify-between px-10 py-4 min-w-[360px]">
      <!-- 왼쪽: brunchstory -->
      <div class="flex items-center space-x-1 text-[var(--detailsTitle)]">
        <img src="../../src/assets/img/Logo.svg" alt="브런치스토리 로고" />
      </div>

      <!-- 오른쪽: 검색 아이콘 + 시작하기 버튼 -->
      <div class="flex items-center space-x-4">
        <!-- 알림종 아이콘 -->
        <button id="alert-icon" class="text-br-start hover:text-[var(--start)] cursor-pointer">
          <img src="../../src/assets/icon/Alarm.svg" alt="알림 아이콘" />
        </button>
        <!-- 검색 아이콘 -->
        <button class="text-br-start hover:text-[var(--start)] cursor-pointer">
          <img src="../../src/assets/icon/SearchVector.svg" alt="검색 아이콘" />
        </button>

        <!-- 시작하기 버튼 -->
        <button class="bg-[var(--start)] text-[var(--line)] rounded-full w-[62px] h-[24px] text-[10px] hover:bg-[var(--icon)] transition cursor-pointer">시작하기</button>

        <!-- 아바타 버튼 -->
        <button id="avatar-icon" class="text-br-start hover:text-[var(--start)] cursor-pointer">
          <img src="../../src/assets/icon/Face.svg" alt="검색 아이콘" />
        </button>
      </div>
    </div>
    <!-- 로그인 후-->

    <div class="flex items-center justify-between px-10 py-4 min-w-[360px]">
      <!-- 왼쪽: brunchstory 로고-->
      <div class="flex items-center space-x-1 text-[var(--detailsTitle)]">
        <img src="../../src/assets/img/Logo.svg" alt="브런치스토리 로고" />
      </div>

      <!-- 오른쪽: 종 아이콘 +검색 + 아바타 버튼 -->
      <div class="flex items-center space-x-4">
        <!-- 알림종 아이콘 -->
        <button class="text-br-start hover:text-[var(--start)] cursor-pointer">
          <img src="../../src/assets/icon/Alarm.svg" alt="알림 아이콘" />
        </button>
        <!-- 검색 아이콘 -->
        <button class="text-br-start hover:text-[var(--start)] cursor-pointer">
          <img src="../../src/assets/icon/SearchVector.svg" alt="검색 아이콘" />
        </button>

        <!-- 아바타 버튼 -->
        <button class="text-br-start hover:text-[var(--start)] cursor-pointer">
          <img src="../../src/assets/icon/Face.svg" alt="검색 아이콘" />
        </button>
      </div>
    </div>
  </body>
</html>
